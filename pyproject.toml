[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender-system"
version = "0.1.0"
description = "Leakage-free, time-aware article recommender experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "scikit-learn==1.4.2",
    "implicit==0.7.3",
    "lightgbm==4.7.0",
    "PyYAML==6.0.1",
    "pyarrow==19.0.0",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
